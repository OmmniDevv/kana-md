<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KANA Super Runner</title>
<style>
html,body{margin:0;padding:0;background:#17102B;color:#fff;font-family:sans-serif;-webkit-user-select:none;user-select:none}
#wrap{height:420px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;box-sizing:border-box;position:relative;overflow:hidden;background:#17102B}
h1{font-size:19px;margin:2px 0;color:#EDE9FE}
.hud{color:#D8CCFF;font-size:15px;min-height:19px;text-align:center}
.how{color:#A78BFA;font-size:12px;text-align:center;padding:0 8px}
canvas{background:#241845;border-radius:12px;touch-action:none}
.btn{background:#8B5CF6;color:#fff;border:0;border-radius:999px;padding:9px 18px;font-size:15px;cursor:pointer}
.btn:active{background:#D946EF}
#over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(12,6,28,.88);z-index:5;text-align:center}
#overT{font-size:24px;color:#F0ABFC}
#overLine{font-size:17px;color:#D8CCFF}
</style>
</head>
<body>
<div id="wrap">
<h1 id="t"></h1><div class="hud"><span id="sl"></span>: <b id="sc">0</b></div>
<canvas id="cv"></canvas>
<div class="how" id="how"></div>
<div id="over"><div id="overT"></div><div id="overLine"><span class="osl"></span> <b id="final">0</b></div><button class="btn" id="again"></button></div>
</div>
<script>
var BOT=null;try{BOT=window.__BOT||null}catch(e){BOT=null}
if(!BOT){try{BOT=__BOT_VARS_JSON__}catch(e){BOT=null}}
var LANG=(BOT&&BOT.lang==='en')?'en':'id';
function el(i){return document.getElementById(i)}
var AC=null;
function beep(f,d){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f||440;g.gain.value=.05;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+(d||.08));o.stop(AC.currentTime+(d||.08));}catch(e){}}
var sentScore=false;
function submitScore(sc){if(sentScore)return;sentScore=true;sc=Math.floor(sc||0);if(sc<=0||!BOT||!BOT.ws||!BOT.token)return;try{var ws=new WebSocket(BOT.ws);ws.onopen=function(){try{ws.send(JSON.stringify({type:'score',token:BOT.token,score:sc}))}catch(e){}setTimeout(function(){try{ws.close()}catch(e){}},700)};ws.onerror=function(){try{ws.close()}catch(e){}};setTimeout(function(){try{ws.close()}catch(e){}},3000);}catch(e){}}
function gameOver(sc){el('final').textContent=Math.floor(sc||0);el('over').style.display='flex';beep(160,.25);submitScore(sc)}
function fitCanvas(cv,w,h){var d=Math.min(window.devicePixelRatio||1,3);cv.width=w*d;cv.height=h*d;cv.style.width='100%';cv.style.maxWidth=w+'px';cv.style.height=h+'px';var c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);return c}
el('again').addEventListener('click',function(){el('over').style.display='none';sentScore=false;if(window.__restart)window.__restart()});
</script>
<script>
var STR={id:{t:'Super Runner KANA',s:'Skor',o:'Game Over!',a:'Main Lagi',h:'Ketuk untuk lompat (bisa lompat dobel). Kumpulkan koin, injak musuh dari atas, jangan sampai menyentuhnya dari samping!'},en:{t:'KANA Super Runner',s:'Score',o:'Game Over!',a:'Play Again',h:'Tap to jump (double jump works). Collect coins, stomp enemies from above, do not touch them from the side!'}}[LANG];
el('t').textContent=STR.t+' 🍄';el('sl').textContent=STR.s;el('how').textContent=STR.h;el('overT').textContent=STR.o;el('again').textContent=STR.a;document.querySelector('.osl').textContent=STR.s+':';
var W=340,H=300,GY=H-44,cv=el('cv'),cx=fitCanvas(cv,W,H);
var y,vy,jumps,items,coins,dist,run,raf,last,spawnT,speed;
function reset(){y=GY-30;vy=0;jumps=0;items=[];coins=0;dist=0;run=true;last=0;spawnT=0;speed=3.4;el('sc').textContent='0';if(raf)cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
window.__restart=reset;
function jump(){if(!run)return;if(jumps<2){vy=jumps===0?-11.8:-10.4;jumps++;beep(jumps===1?620:760,.07)}}
cv.addEventListener('pointerdown',function(e){e.preventDefault();jump()});
document.addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}});
function spawn(){var r=Math.random();if(r<0.42)items.push({x:W+24,kind:'coin',y:GY-52-Math.random()*70,taken:false});else if(r<0.78)items.push({x:W+24,kind:'enemy',taken:false});else items.push({x:W+24,kind:'block',taken:false})}
function loop(ts){if(!run)return;var dt=Math.min(32,ts-(last||ts));last=ts;var step=speed*(dt/16.7);dist+=step;spawnT+=dt;if(spawnT>880){spawnT=0;spawn()}
 vy+=0.6;y+=vy;if(y>GY-30){y=GY-30;vy=0;jumps=0}
 cx.fillStyle='#1E1145';cx.fillRect(0,0,W,H);cx.fillStyle='#F5D0FE';cx.beginPath();cx.arc(W-46,36,15,0,6.29);cx.fill();
 cx.fillStyle='#312E81';for(var b=0;b<5;b++){var bx=((b*97-(dist*0.4)%97)+W)%W;cx.fillRect(bx,GY-64-Math.sin(b)*14,44,64)}
 cx.fillStyle='#8B5CF6';cx.fillRect(0,GY,W,3);cx.fillStyle='#2E1065';cx.fillRect(0,GY+3,W,H-GY);
 for(var i=items.length-1;i>=0;i--){var o=items[i];o.x-=step;if(o.x<-30){items.splice(i,1);continue}
  var px=54,ps=30;
  if(o.kind==='coin'){cx.fillStyle='#FBBF24';cx.beginPath();cx.arc(o.x,o.y,9,0,6.29);cx.fill();cx.fillStyle='#F59E0B';cx.beginPath();cx.arc(o.x,o.y,5,0,6.29);cx.fill();
   if(!o.taken&&Math.abs(o.x-(px+15))<24&&Math.abs(o.y-(y+15))<30){o.taken=true;items.splice(i,1);coins++;el('sc').textContent=coins*10+Math.floor(dist/50);beep(990,.06)}}
  else if(o.kind==='enemy'){var ey=GY-22;cx.fillStyle='#EF4444';cx.beginPath();cx.arc(o.x,ey,13,3.14,0);cx.fill();cx.fillRect(o.x-13,ey,26,10);cx.fillStyle='#fff';cx.beginPath();cx.arc(o.x-5,ey-4,3.4,0,6.29);cx.arc(o.x+5,ey-4,3.4,0,6.29);cx.fill();
   if(Math.abs(o.x-(px+15))<24&&y+ps>ey-12){if(vy>1&&y+ps<ey+6){items.splice(i,1);coins+=2;vy=-9;el('sc').textContent=coins*10+Math.floor(dist/50);beep(500,.09)}else{run=false;gameOver(coins*10+Math.floor(dist/50));return}}}
  else{cx.fillStyle='#A16207';cx.fillRect(o.x,GY-26,26,26);cx.fillStyle='#FBBF24';cx.fillRect(o.x,GY-26,26,4);
   if(px+ps>o.x&&px<o.x+26&&y+ps>GY-26&&y+ps<GY-8){if(vy>=0){y=GY-26-ps;vy=0;jumps=0}else{run=false;gameOver(coins*10+Math.floor(dist/50));return}}}}
 cx.fillStyle='#DC2626';cx.fillRect(54,y+16,30,14);cx.fillStyle='#2563EB';cx.fillRect(58,y+8,22,10);cx.fillStyle='#FCA5A5';cx.fillRect(62,y,14,9);cx.fillStyle='#DC2626';cx.fillRect(58,y-5,24,6);
 if(Math.floor(ts/200)%2===0&&y>=GY-31){cx.fillStyle='#FCA5A5';cx.fillRect(58,y+29,8,4);cx.fillRect(74,y+29,8,4)}else{cx.fillStyle='#FCA5A5';cx.fillRect(66,y+29,8,4)}
 speed+=dt*0.0001;raf=requestAnimationFrame(loop)}
reset();
</script>
</body>
</html>
