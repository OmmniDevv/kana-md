<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KANA Breakout</title>
<style>
html,body{margin:0;padding:0;background:#17102B;color:#fff;font-family:sans-serif;-webkit-user-select:none;user-select:none}
#wrap{height:460px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;box-sizing:border-box;position:relative;overflow:hidden;background:#17102B}
h1{font-size:19px;margin:2px 0;color:#EDE9FE}
.hud{color:#D8CCFF;font-size:15px;min-height:19px;text-align:center}
.how{color:#A78BFA;font-size:12px;text-align:center;padding:0 8px}
canvas{background:#241845;border-radius:12px;touch-action:none}
.btn{background:#8B5CF6;color:#fff;border:0;border-radius:999px;padding:9px 18px;font-size:15px;cursor:pointer}
.btn:active{background:#D946EF}
.ctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.cbtn{background:#2E1065;color:#fff;border:2px solid #8B5CF6;border-radius:12px;width:52px;height:46px;font-size:20px;cursor:pointer;touch-action:none}
.cbtn:active{background:#D946EF}
#over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(12,6,28,.88);z-index:5;text-align:center}
#overT{font-size:24px;color:#F0ABFC}
#overLine{font-size:17px;color:#D8CCFF}

</style>
</head>
<body>
<div id="wrap">
<h1 id="t"></h1><div class="hud"><span id="sl"></span>: <b id="sc">0</b> · <span id="vl"></span>: <b id="lv">3</b> · <span id="ll"></span> <b id="lvl">1</b></div>
<canvas id="cv"></canvas>
<div class="ctl"><button class="cbtn" id="bl">⬅</button><button class="cbtn" id="br">➡</button></div>
<div class="how" id="how"></div>
<div id="over"><div id="overT"></div><div id="overLine"><span class="osl"></span> <b id="final">0</b></div><button class="btn" id="again"></button></div>
</div>
<script>
var BOT=null;try{BOT=window.__BOT||null}catch(e){BOT=null}
if(!BOT){try{BOT=__BOT_VARS_JSON__}catch(e){BOT=null}}
var LANG=(BOT&&BOT.lang==='en')?'en':'id';
function el(i){return document.getElementById(i)}
var AC=null;
function beep(f,d){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f||440;g.gain.value=.05;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+(d||.08));o.stop(AC.currentTime+(d||.08));}catch(e){}}
var sentScore=false;
function submitScore(sc){if(sentScore)return;sentScore=true;sc=Math.floor(sc||0);if(sc<=0||!BOT||!BOT.ws||!BOT.token)return;try{var ws=new WebSocket(BOT.ws);ws.onopen=function(){try{ws.send(JSON.stringify({type:'score',token:BOT.token,score:sc}))}catch(e){}setTimeout(function(){try{ws.close()}catch(e){}},700)};ws.onerror=function(){try{ws.close()}catch(e){}};setTimeout(function(){try{ws.close()}catch(e){}},3000);}catch(e){}}
function gameOver(sc){el('final').textContent=Math.floor(sc||0);el('over').style.display='flex';beep(160,.25);submitScore(sc)}
function fitCanvas(cv,w,h){var d=Math.min(window.devicePixelRatio||1,3);cv.width=w*d;cv.height=h*d;cv.style.width='100%';cv.style.maxWidth=w+'px';cv.style.height=h+'px';var c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);return c}
function ptr(cv,e,w,h){var r=cv.getBoundingClientRect();var t=(e.touches&&e.touches[0])?e.touches[0]:e;return{x:(t.clientX-r.left)*w/r.width,y:(t.clientY-r.top)*h/r.height}}
el('again').addEventListener('click',function(){el('over').style.display='none';sentScore=false;if(window.__restart)window.__restart()});
</script>
<script>
var STR={id:{t:'Breakout KANA',s:'Skor',o:'Game Over!',a:'Main Lagi',v:'Nyawa',l:'Level',h:'Gerakkan paddle dengan menyeret di papan atau tombol. Hancurkan semua bata!'},en:{t:'KANA Breakout',s:'Score',o:'Game Over!',a:'Play Again',v:'Lives',l:'Level',h:'Move the paddle by dragging on the board or with buttons. Break all the bricks!'}}[LANG];
el('t').textContent=STR.t+' 🧱';el('sl').textContent=STR.s;el('vl').textContent=STR.v;el('ll').textContent=STR.l;el('how').textContent=STR.h;el('overT').textContent=STR.o;el('again').textContent=STR.a;document.querySelector('.osl').textContent=STR.s+':';
var W=340,H=290,cv=el('cv'),ctx=fitCanvas(cv,W,H);
var ROWC=['#D946EF','#A855F7','#8B5CF6','#7C3AED','#E879F9'];
var px,bx,by,bvx,bvy,bricks,score,lives,level,run,raf,last,ml,mr,PW=72;
function buildBricks(){bricks=[];for(var r=0;r<5;r++)for(var c=0;c<7;c++)bricks.push({x:8+c*47,y:26+r*20,w:42,h:14,col:ROWC[r],on:true})}
function resetBall(){bx=W/2;by=H-46;bvx=(2+level*0.3)*(Math.random()<0.5?-1:1);bvy=-(3.2+level*0.3)}
function start(){score=0;lives=3;level=1;px=W/2-PW/2;ml=false;mr=false;run=true;last=0;el('sc').textContent='0';el('lv').textContent='3';el('lvl').textContent='1';buildBricks();resetBall();if(raf)cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function loop(ts){if(!run)return;var dt=Math.min(32,ts-(last||ts));last=ts;var f=dt/16.7;
 if(ml)px-=6*f;if(mr)px+=6*f;if(px<0)px=0;if(px>W-PW)px=W-PW;
 bx+=bvx*f;by+=bvy*f;
 if(bx<8){bx=8;bvx=Math.abs(bvx)}if(bx>W-8){bx=W-8;bvx=-Math.abs(bvx)}if(by<8){by=8;bvy=Math.abs(bvy)}
 if(bvy>0&&by+8>=H-18&&by+8<=H-8&&bx>=px&&bx<=px+PW){bvy=-Math.abs(bvy);bvx=((bx-(px+PW/2))/(PW/2))*3.4;beep(500,.05)}
 var remain=0;
 for(var i=0;i<bricks.length;i++){var b=bricks[i];if(!b.on)continue;remain++;
  if(bx+7>b.x&&bx-7<b.x+b.w&&by+7>b.y&&by-7<b.y+b.h){b.on=false;score+=10;el('sc').textContent=score;bvy=-bvy;beep(760,.05);remain--;break}}
 if(remain===0){score+=100;el('sc').textContent=score;level++;el('lvl').textContent=level;buildBricks();resetBall()}
 if(by-8>H){lives--;el('lv').textContent=lives;beep(200,.15);if(lives<=0){run=false;draw();gameOver(score);return}resetBall()}
 draw();raf=requestAnimationFrame(loop)}
function draw(){ctx.clearRect(0,0,W,H);
 for(var i=0;i<bricks.length;i++){var b=bricks[i];if(!b.on)continue;ctx.fillStyle=b.col;ctx.fillRect(b.x,b.y,b.w,b.h)}
 ctx.fillStyle='#EDE9FE';ctx.fillRect(px,H-18,PW,10);
 ctx.fillStyle='#F0ABFC';ctx.beginPath();ctx.arc(bx,by,8,0,Math.PI*2);ctx.fill()}
cv.addEventListener('pointermove',function(e){var p=ptr(cv,e,W,H);px=p.x-PW/2;if(px<0)px=0;if(px>W-PW)px=W-PW});
cv.addEventListener('pointerdown',function(e){var p=ptr(cv,e,W,H);px=p.x-PW/2;if(px<0)px=0;if(px>W-PW)px=W-PW});
el('bl').addEventListener('pointerdown',function(e){e.preventDefault();ml=true});el('bl').addEventListener('pointerup',function(){ml=false});el('bl').addEventListener('pointerleave',function(){ml=false});
el('br').addEventListener('pointerdown',function(e){e.preventDefault();mr=true});el('br').addEventListener('pointerup',function(){mr=false});el('br').addEventListener('pointerleave',function(){mr=false});
document.addEventListener('visibilitychange',function(){if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=null}else if(run&&!raf){last=0;raf=requestAnimationFrame(loop)}});
window.__restart=start;start();
</script>
</body>
</html>
