<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KANA 2048</title>
<style>
html,body{margin:0;padding:0;background:#17102B;color:#fff;font-family:sans-serif;-webkit-user-select:none;user-select:none}
#wrap{height:520px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;box-sizing:border-box;position:relative;overflow:hidden;background:#17102B}
h1{font-size:19px;margin:2px 0;color:#EDE9FE}
.hud{color:#D8CCFF;font-size:15px;min-height:19px;text-align:center}
.how{color:#A78BFA;font-size:12px;text-align:center;padding:0 8px}
canvas{background:#241845;border-radius:12px;touch-action:none}
.btn{background:#8B5CF6;color:#fff;border:0;border-radius:999px;padding:9px 18px;font-size:15px;cursor:pointer}
.btn:active{background:#D946EF}
.ctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.cbtn{background:#2E1065;color:#fff;border:2px solid #8B5CF6;border-radius:12px;width:52px;height:46px;font-size:20px;cursor:pointer;touch-action:none}
.cbtn:active{background:#D946EF}
#over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(12,6,28,.88);z-index:5;text-align:center}
#overT{font-size:24px;color:#F0ABFC}
#overLine{font-size:17px;color:#D8CCFF}

#board{display:grid;grid-template-columns:repeat(4,68px);gap:8px;background:#241845;padding:10px;border-radius:14px;touch-action:none}
.tile{width:68px;height:68px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:bold;background:#3B2A63;color:#fff}

</style>
</head>
<body>
<div id="wrap">
<h1 id="t"></h1><div class="hud"><span id="sl"></span>: <b id="sc">0</b></div>
<div id="board"></div>
<div class="ctl"><button class="cbtn" data-d="up">⬆</button></div>
<div class="ctl"><button class="cbtn" data-d="left">⬅</button><button class="cbtn" data-d="down">⬇</button><button class="cbtn" data-d="right">➡</button></div>
<div class="how" id="how"></div>
<div id="over"><div id="overT"></div><div id="overLine"><span class="osl"></span> <b id="final">0</b></div><button class="btn" id="again"></button></div>
</div>
<script>
var BOT=null;try{BOT=window.__BOT||null}catch(e){BOT=null}
if(!BOT){try{BOT=__BOT_VARS_JSON__}catch(e){BOT=null}}
var LANG=(BOT&&BOT.lang==='en')?'en':'id';
function el(i){return document.getElementById(i)}
var AC=null;
function beep(f,d){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f||440;g.gain.value=.05;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+(d||.08));o.stop(AC.currentTime+(d||.08));}catch(e){}}
var sentScore=false;
function submitScore(sc){if(sentScore)return;sentScore=true;sc=Math.floor(sc||0);if(sc<=0||!BOT||!BOT.ws||!BOT.token)return;try{var ws=new WebSocket(BOT.ws);ws.onopen=function(){try{ws.send(JSON.stringify({type:'score',token:BOT.token,score:sc}))}catch(e){}setTimeout(function(){try{ws.close()}catch(e){}},700)};ws.onerror=function(){try{ws.close()}catch(e){}};setTimeout(function(){try{ws.close()}catch(e){}},3000);}catch(e){}}
function gameOver(sc){el('final').textContent=Math.floor(sc||0);el('over').style.display='flex';beep(160,.25);submitScore(sc)}
function fitCanvas(cv,w,h){var d=Math.min(window.devicePixelRatio||1,3);cv.width=w*d;cv.height=h*d;cv.style.width='100%';cv.style.maxWidth=w+'px';cv.style.height=h+'px';var c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);return c}
function ptr(cv,e,w,h){var r=cv.getBoundingClientRect();var t=(e.touches&&e.touches[0])?e.touches[0]:e;return{x:(t.clientX-r.left)*w/r.width,y:(t.clientY-r.top)*h/r.height}}
el('again').addEventListener('click',function(){el('over').style.display='none';sentScore=false;if(window.__restart)window.__restart()});
</script>
<script>
var STR={id:{t:'2048 KANA',s:'Skor',o:'Game Over!',a:'Main Lagi',h:'Geser ubin dengan swipe atau tombol arah. Gabungkan angka yang sama!'},en:{t:'KANA 2048',s:'Score',o:'Game Over!',a:'Play Again',h:'Slide tiles with swipe or arrow buttons. Merge matching numbers!'}}[LANG];
el('t').textContent=STR.t+' 🔢';el('sl').textContent=STR.s;el('how').textContent=STR.h;el('overT').textContent=STR.o;el('again').textContent=STR.a;document.querySelector('.osl').textContent=STR.s+':';
var COLORS={2:'#4C1D95',4:'#5B21B6',8:'#7C3AED',16:'#8B5CF6',32:'#A855F7',64:'#C026D3',128:'#D946EF',256:'#E879F9',512:'#F0ABFC',1024:'#F5D0FE',2048:'#FDF4FF'};
var b,score,over;
function spawn(){var e=[];for(var i=0;i<16;i++)if(!b[i])e.push(i);if(!e.length)return;b[e[Math.floor(Math.random()*e.length)]]=Math.random()<0.9?2:4}
function render(){var bd=el('board');bd.innerHTML='';for(var i=0;i<16;i++){var d=document.createElement('div');d.className='tile';if(b[i]){d.textContent=b[i];d.style.background=COLORS[b[i]]||'#F0ABFC';if(b[i]>=128)d.style.color='#3B0764'}bd.appendChild(d)}el('sc').textContent=score}
function line(idx){var vals=idx.map(function(i){return b[i]}).filter(function(v){return v>0});var out=[];
 for(var i=0;i<vals.length;i++){if(i+1<vals.length&&vals[i]===vals[i+1]){out.push(vals[i]*2);score+=vals[i]*2;i++}else out.push(vals[i])}
 while(out.length<4)out.push(0);return out}
function move(d){if(over)return;var nb=b.slice();
 for(var r=0;r<4;r++){var idx=[];
  if(d==='left')idx=[r*4,r*4+1,r*4+2,r*4+3];
  if(d==='right')idx=[r*4+3,r*4+2,r*4+1,r*4];
  if(d==='up')idx=[r,r+4,r+8,r+12];
  if(d==='down')idx=[r+12,r+8,r+4,r];
  var nl=line(idx);for(var k=0;k<4;k++)nb[idx[k]]=nl[k]}
 var changed=false;for(var i=0;i<16;i++)if(nb[i]!==b[i])changed=true;
 if(!changed)return;b=nb;spawn();render();beep(440,.04);checkOver()}
function checkOver(){for(var i=0;i<16;i++)if(!b[i])return;
 for(var r=0;r<4;r++)for(var c=0;c<4;c++){var v=b[r*4+c];if(c<3&&b[r*4+c+1]===v)return;if(r<3&&b[(r+1)*4+c]===v)return}
 over=true;setTimeout(function(){gameOver(score)},250)}
function start(){b=[];for(var i=0;i<16;i++)b.push(0);score=0;over=false;spawn();spawn();render()}
var db=document.querySelectorAll('[data-d]');
for(var k=0;k<db.length;k++)db[k].addEventListener('pointerdown',function(e){e.preventDefault();move(this.getAttribute('data-d'))});
var sx=0,sy=0,bd2=el('board');
bd2.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
bd2.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)<24&&Math.abs(dy)<24)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');else move(dy>0?'down':'up')});
document.addEventListener('keydown',function(e){if(e.key.indexOf('Arrow')===0){e.preventDefault();move(e.key.replace('Arrow','').toLowerCase())}});
window.__restart=start;start();
</script>
</body>
</html>
